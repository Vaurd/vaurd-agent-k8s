{{- if not .Values.persistence.existingClaim }}
{{- /*
Shared volume mounted at /data in all three components. It holds the encrypted
database and the plugin binaries downloaded after registration, so it must be
writable by pods on different nodes.
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vaurd-agent.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vaurd-agent.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
