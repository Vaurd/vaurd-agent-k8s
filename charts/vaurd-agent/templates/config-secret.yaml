{{- if not .Values.config.existingSecret }}
{{- /*
The single config.yml every component reads, mounted at /etc/vaurd/config.yml.
The agent takes its settings only from this file — environment variables are
ignored — so everything configurable lives here.

Skipped entirely when config.existingSecret is set, in which case that Secret
must provide a `config.yml` key of its own.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaurd-agent.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vaurd-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yml: |
    app: vaurd-agent

    # gRPC port the core service listens on.
    port: {{ .Values.core.service.port }}

    # License token issued by the Vaurd platform. Core exchanges it for the
    # database encryption key, which it then serves to the other components.
    license: {{ required "config.license is required" .Values.config.license | quote }}

    vaurd:
      manager_url: {{ required "config.platform.url is required" .Values.config.platform.url | quote }}
      {{- with .Values.config.platform.caCert }}
      ca_cert: |
        {{- . | trim | nindent 8 }}
      {{- end }}
      ping_interval_seconds: {{ .Values.config.platform.pingIntervalSeconds }}
      status_guard_poll_seconds: {{ .Values.config.platform.statusGuardPollSeconds }}

    services:
      storage:
        # The shared volume every component mounts.
        data_dir: /data

      nats:
        endpoint: {{ include "vaurd-agent.natsEndpoint" . | quote }}
        username: {{ .Values.nats.auth.username | quote }}
        password: {{ required "nats.auth.password is required unless config.existingSecret is set" .Values.nats.auth.password | quote }}

      # Every component calls core over gRPC on start-up to fetch the database
      # encryption key.
      core:
        address: {{ printf "%s-core:%v" (include "vaurd-agent.fullname" .) .Values.core.service.port | quote }}
        server_name: {{ .Values.config.tls.serverName | quote }}

      # The evaluator always reaches source-connector inside its own pod.
      source_connector:
        address: "localhost:5004"
        server_name: {{ .Values.config.tls.serverName | quote }}

    evaluator:
      max_concurrency: {{ .Values.worker.maxConcurrency }}
    {{- if and .Values.config.tls.serverCert .Values.config.tls.serverKey }}

    # In-cluster mTLS. Core and source-connector serve plaintext gRPC unless
    # both server_cert and server_key are set.
    server_cert: |
      {{- .Values.config.tls.serverCert | trim | nindent 6 }}
    server_key: |
      {{- .Values.config.tls.serverKey | trim | nindent 6 }}
    {{- with .Values.config.tls.caCert }}
    ca_cert: |
      {{- . | trim | nindent 6 }}
    {{- end }}
    {{- end }}

    {{- if .Values.config.sources }}

    # Data sources the agent connects to. Plugins are downloaded to the shared
    # volume after the agent registers with the platform.
    sources:
      {{- toYaml .Values.config.sources | nindent 6 }}
    {{- else }}

    sources: []
    {{- end }}
{{- end }}
