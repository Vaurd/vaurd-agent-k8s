{{- if and .Values.nats.enabled (not .Values.nats.auth.existingNatsSecret) }}
{{- /*
Credentials for the bundled NATS server. The server reads them from here; the
agent gets the same values through its own config.yml, which is the only place
it reads settings from.

Skipped when nats.auth.existingNatsSecret names a Secret of your own, and when the
bundled server is disabled — an external NATS server has credentials this chart
did not choose, so nats.auth.password is required in that case.

nats.auth.password left empty means the chart generates one on first install
and reuses it on every upgrade; see the natsPassword helper for how that is
resolved and when it is not stable.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaurd-agent.natsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vaurd-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
type: Opaque
stringData:
  username: {{ include "vaurd-agent.natsUsername" . | quote }}
  password: {{ include "vaurd-agent.natsPassword" . | quote }}
{{- end }}
