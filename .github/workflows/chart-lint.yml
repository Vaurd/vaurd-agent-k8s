# Validates the chart on every pull request.
#
# `ct lint` fails when the chart version was not bumped, which is the single
# most useful guard here: chart versions are immutable once published, and the
# release job on main silently skips a version that already exists.
name: Lint Helm Chart

on:
  pull_request:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/chart-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ct compares the chart version against the base branch

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Lint chart (fails if the version was not bumped)
        run: |
          ct lint --charts charts/vaurd-agent \
                  --target-branch ${{ github.event.pull_request.base.ref }}

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests
        run: |
          helm template va charts/vaurd-agent -n vaurd \
            --set config.license=test \
            --set config.platform.url=manager:5000 \
            --set nats.auth.password=test \
            | kubeconform -strict -summary -kubernetes-version 1.29.0

      - name: Validate raw manifests
        run: |
          # The manifests ship with <placeholders>; strip them to a parseable
          # form so kubeconform checks structure rather than user values.
          # One file at a time — concatenating them would merge the last
          # document of one file into the first of the next.
          for f in k8s/*.yaml; do
            echo "== $f"
            sed 's/<[^>]*>/placeholder/g' "$f" \
              | kubeconform -strict -summary -kubernetes-version 1.29.0
          done
